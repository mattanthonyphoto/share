const SESSION_KEY = "IiIMcKev";   // null OR a string — when set, caches the code in sessionStorage for the tab
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const enc = new TextEncoder();
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(DATA.salt), iterations:DATA.iters, hash:"SHA-256"},
    baseKey, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(DATA.iv)}, key, b64(DATA.ct));
  return new TextDecoder().decode(pt);
}
function reveal(html){ document.open(); document.write(html); document.close(); }
const btn = document.getElementById("b");
btn.disabled = true;  // start disabled; enabled below after cached-unlock attempt
(async () => {
  if (SESSION_KEY) {
    const cached = sessionStorage.getItem(SESSION_KEY);
    if (cached) {
      try { const html = await unlock(cached); reveal(html); return; }
      catch (_) { sessionStorage.removeItem(SESSION_KEY); }
    }
  }
  btn.disabled = false;
  document.getElementById("pw").focus();
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const er=document.getElementById("e");
  btn.disabled=true; er.textContent="";
  const pw = document.getElementById("pw").value;
  try{
    const html = await unlock(pw);
    if (SESSION_KEY) sessionStorage.setItem(SESSION_KEY, pw);
    reveal(html);
  }catch(_){
    er.textContent="Incorrect code. Try again.";
    btn.disabled=false;
  }
});
</script>
